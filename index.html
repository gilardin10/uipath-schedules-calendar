<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UiPath Schedule Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'apollo-bg':      '#040E19',
            'apollo-surface': '#0B1929',
            'apollo-border':  '#1A3050',
            'apollo-orange':  '#FA4616',
            'apollo-blue':    '#00AEEF',
            'apollo-text':    '#C8D8E8',
            'apollo-muted':   '#5A7A9A',
          }
        }
      }
    }
  </script>
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel standalone (JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Croner – CRON parser with proper UMD browser build -->
  <script src="https://cdn.jsdelivr.net/npm/croner@8/dist/croner.umd.min.js"></script>
</head>
<body class="bg-apollo-bg text-apollo-text min-h-screen">
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
